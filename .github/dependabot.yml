version: 2

updates:
  # ==============================
  # Frontend (React / Node)
  # ==============================
  - package-ecosystem: "npm"
    directory: "/forms-flow-web"
    target-branch: "dependabot-updates"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "frontend"
      - "dependabot"

    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # ==============================
  # Backend Python (API)
  # ==============================
  - package-ecosystem: "pip"
    directory: "/forms-flow-api"
    target-branch: "dependabot-updates"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"

    labels:
      - "dependencies"
      - "backend"
      - "python"

    groups:
      api-dependencies:
        patterns:
          - "*"

  # ==============================
  # Backend Python (Documents)
  # ==============================
  - package-ecosystem: "pip"
    directory: "/forms-flow-documents"
    target-branch: "dependabot-updates"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"

    labels:
      - "dependencies"
      - "backend"
      - "python"

    groups:
      documents-dependencies:
        patterns:
          - "*"

  # ==============================
  # BPM Engine (Camunda service)
  # ==============================
  - package-ecosystem: "maven"
    directory: "/forms-flow-bpm"
    target-branch: "dependabot-updates"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"

    labels:
      - "dependencies"
      - "backend"
      - "bpm"

    groups:
      bpm-dependencies:
        patterns:
          - "*"

  # ==============================
  # Python Analytics
  # ==============================
  - package-ecosystem: "pip"
    directory: "/forms-flow-analytics"
    target-branch: "dependabot-updates"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"

    labels:
      - "dependencies"
      - "python"

    groups:
      analytics-dependencies:
        patterns:
          - "*"

  # ==============================
  # Docker Images
  # ==============================
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dependabot-updates"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"

    labels:
      - "dependencies"
      - "docker"

    groups:
      docker-base-images:
        patterns:
          - "*"

  # ==============================
  # GitHub Actions
  # ==============================
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dependabot-updates"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"

    labels:
      - "dependencies"
      - "ci"

    groups:
      github-actions:
        patterns:
          - "*"